# ============================================
# 创作工作台 - GitHub Actions 定时任务
# ============================================
# 每天 3 次自动运行采集和生成任务
# 北京时间：08:00 / 14:00 / 20:00
# UTC 时间：00:00 / 06:00 / 12:00
# ============================================

name: 创作工作台 - 每日数据采集

on:
  schedule:
    # 北京时间 早8点 = UTC 0点
    - cron: '0 0 * * *'
    # 北京时间 下午2点 = UTC 6点
    - cron: '0 6 * * *'
    # 北京时间 晚8点 = UTC 12点
    - cron: '0 12 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      gist: write
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🚀 运行采集脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          NICHE_KEYWORDS: ${{ secrets.NICHE_KEYWORDS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-4o-mini' }}
        run: python3 fetch_and_generate.py
      
      - name: 📊 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: output.json
          retention-days: 7
