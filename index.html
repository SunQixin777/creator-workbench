<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>创作工作台</title>
<style>
:root {
  --primary: #556B2F;
  --primary-light: #6B8E23;
  --primary-dark: #3E4F22;
  --primary-bg: #F4F7F0;
  --primary-surface: #E8EFE0;
  --accent: #8FBC8F;
  --accent-dark: #2E8B57;
  --text: #2D2D2D;
  --text-secondary: #6B7280;
  --text-light: #9CA3AF;
  --white: #FFFFFF;
  --danger: #EF4444;
  --warning: #F59E0B;
  --success: #10B981;
  --shadow: 0 2px 12px rgba(85,107,47,0.12);
  --shadow-lg: 0 8px 30px rgba(85,107,47,0.18);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--primary-bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  line-height: 1.6;
}

/* ===== 抽屉导航 ===== */
.drawer-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.45); z-index: 998;
  opacity: 0; visibility: hidden; transition: var(--transition);
}
.drawer-overlay.active { opacity:1; visibility:visible; }
.drawer {
  position: fixed; top:0; left:0; bottom:0; width: 280px;
  background: var(--white); z-index: 999;
  transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 4px 0 24px rgba(0,0,0,0.15);
  display: flex; flex-direction: column;
}
.drawer.active { transform: translateX(0); }
.drawer-header {
  padding: 48px 24px 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: var(--white);
}
.drawer-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.drawer-header p { font-size: 13px; opacity: 0.85; }
.drawer-nav { flex:1; overflow-y: auto; padding: 12px 0; }
.nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 24px; cursor: pointer;
  transition: var(--transition); color: var(--text);
  border-left: 3px solid transparent;
  font-size: 15px;
}
.nav-item:hover { background: var(--primary-bg); }
.nav-item.active {
  background: var(--primary-bg);
  border-left-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}
.nav-item .nav-icon {
  width: 36px; height: 36px; border-radius: var(--radius-xs);
  display: flex; align-items: center; justify-content: center;
  background: var(--primary-surface); color: var(--primary);
  font-size: 18px; flex-shrink: 0;
}
.nav-item.active .nav-icon { background: var(--primary); color: var(--white); }
.drawer-footer {
  padding: 16px 24px; border-top: 1px solid #E5E7EB;
  font-size: 12px; color: var(--text-light); text-align: center;
}

/* ===== 顶部栏 ===== */
.topbar {
  position: sticky; top:0; z-index: 100;
  background: var(--white);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.menu-btn {
  width: 40px; height: 40px; border: none; background: var(--primary-surface);
  border-radius: var(--radius-xs); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--primary); transition: var(--transition);
}
.menu-btn:active { transform: scale(0.92); }
.topbar-title { font-size: 18px; font-weight: 700; color: var(--text); }
.topbar-right { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border: none;
  background: var(--primary-surface); border-radius: var(--radius-xs);
  cursor: pointer; font-size: 16px; color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.icon-btn:active { transform: scale(0.92); }

/* ===== 内容区 ===== */
.page { display: none; padding: 16px; padding-bottom: calc(100px + var(--safe-bottom)); }
.page.active { display: block; }
.page-header {
  margin-bottom: 20px;
}
.page-header h1 { font-size: 22px; font-weight: 700; }
.page-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* ===== 卡片 ===== */
.card {
  background: var(--white); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px;
  box-shadow: var(--shadow); transition: var(--transition);
}
.card:active { box-shadow: var(--shadow-lg); }

/* ===== 进度条 ===== */
.progress-bar {
  width: 100%; height: 8px; background: var(--primary-surface);
  border-radius: 4px; overflow: hidden; margin: 12px 0;
}
.progress-bar .fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent-dark));
  border-radius: 4px; transition: width 0.5s ease;
}
.progress-text {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--text-secondary);
}

/* ===== 清单项 ===== */
.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid #F3F4F6;
  transition: var(--transition);
}
.check-item:last-child { border-bottom: none; }
.check-item input[type="checkbox"] {
  width: 22px; height: 22px; flex-shrink: 0;
  accent-color: var(--primary); margin-top: 1px;
  cursor: pointer; border-radius: 6px;
}
.check-item.done label { text-decoration: line-through; color: var(--text-light); }
.check-item label { flex:1; cursor: pointer; font-size: 14px; }

/* ===== 按钮 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: var(--transition);
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: var(--white); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline {
  background: transparent; color: var(--primary);
  border: 1.5px solid var(--primary);
}
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-danger { background: var(--danger); color: var(--white); }
.btn-success { background: var(--success); color: var(--white); }
.btn-block { width: 100%; }

/* ===== 标签 ===== */
.tag {
  display: inline-block; padding: 3px 10px;
  background: var(--primary-surface); color: var(--primary);
  border-radius: 20px; font-size: 12px; margin: 2px 4px 2px 0;
  font-weight: 500;
}
.tag-hot { background: #FEE2E2; color: var(--danger); }
.tag-new { background: #DBEAFE; color: #2563EB; }

/* ===== 灵感卡片 ===== */
.inspire-card {
  background: var(--white); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--primary);
}
.inspire-card .inspire-title {
  font-size: 15px; font-weight: 600; margin-bottom: 8px;
}
.inspire-card .inspire-tags { margin-bottom: 8px; }
.inspire-card .inspire-desc {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;
  line-height: 1.7;
}
.inspire-card .inspire-actions {
  display: flex; gap: 8px;
}
.inspire-card .inspire-actions .btn { padding: 6px 12px; font-size: 12px; }

/* ===== 热点卡片 ===== */
.hot-card {
  background: var(--white); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.hot-card .hot-rank {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--primary); color: var(--white);
  font-size: 14px; font-weight: 700; margin-right: 10px;
}
.hot-card .hot-rank.top3 { background: var(--danger); }
.hot-card .hot-content { font-size: 14px; font-weight: 500; }
.hot-card .hot-angle {
  margin-top: 10px; padding: 10px 12px;
  background: var(--primary-bg); border-radius: var(--radius-xs);
  font-size: 13px; color: var(--text-secondary);
}
.hot-card .hot-angle strong { color: var(--primary); }

/* ===== 复盘统计 ===== */
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin-bottom: 16px;
}
.stat-box {
  background: var(--white); border-radius: var(--radius-sm);
  padding: 14px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat-box .stat-num {
  font-size: 22px; font-weight: 700; color: var(--primary);
}
.stat-box .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
textarea.auto-resize {
  width: 100%; border: 1.5px solid #E5E7EB;
  border-radius: var(--radius-xs); padding: 12px;
  font-size: 14px; font-family: inherit; resize: none;
  transition: var(--transition); line-height: 1.6;
  background: var(--primary-bg);
}
textarea.auto-resize:focus {
  outline: none; border-color: var(--primary);
  background: var(--white);
}
textarea.auto-resize::placeholder { color: var(--text-light); }

/* ===== 备忘录 ===== */
.memo-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid #F3F4F6;
}
.memo-item:last-child { border-bottom: none; }
.memo-item input[type="checkbox"] {
  width: 20px; height: 20px; accent-color: var(--primary); flex-shrink: 0;
  cursor: pointer; border-radius: 5px;
}
.memo-item input[type="text"] {
  flex: 1; border: none; background: transparent;
  font-size: 14px; font-family: inherit; outline: none;
}
.memo-item.done input[type="text"] {
  text-decoration: line-through; color: var(--text-light);
}
.memo-item .del-btn {
  width: 28px; height: 28px; border: none; background: #FEE2E2;
  border-radius: 6px; cursor: pointer; color: var(--danger);
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== 速算 & 申论 ===== */
.article-card {
  background: var(--white); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  cursor: pointer;
}
.article-card .article-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.article-card .article-source {
  font-size: 12px; color: var(--text-light); margin-bottom: 8px;
}
.article-card .article-preview {
  font-size: 13px; color: var(--text-secondary);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===== 输入框 ===== */
.input-field {
  width: 100%; padding: 12px 16px;
  border: 1.5px solid #E5E7EB; border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit;
  transition: var(--transition); background: var(--white);
}
.input-field:focus { outline: none; border-color: var(--primary); }

/* ===== 空状态 ===== */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ===== 刷新动画 ===== */
.refreshing .icon-btn { animation: spin 1s linear infinite; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.78); color: var(--white);
  padding: 10px 24px; border-radius: 24px;
  font-size: 14px; z-index: 1000;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ===== 切换开关 ===== */
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-title h3 { font-size: 16px; font-weight: 600; }
.section-title .date-badge {
  font-size: 12px; color: var(--text-light);
  background: var(--primary-surface); padding: 3px 10px;
  border-radius: 20px;
}

/* ===== 模态框 ===== */
.modal-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.45); z-index: 500;
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--white); border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 500px; max-height: 80vh;
  padding: 24px; overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal .form-group { margin-bottom: 14px; }
.modal .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }

/* ===== 浮动添加按钮 ===== */
.fab {
  position: fixed; bottom: calc(24px + var(--safe-bottom)); right: 20px;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent-dark));
  color: var(--white); border: none; cursor: pointer;
  font-size: 28px; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); z-index: 50;
}
.fab:active { transform: scale(0.9); }

/* ===== 搜索栏 ===== */
.search-bar {
  position: relative; margin-bottom: 16px;
}
.search-bar input {
  width: 100%; padding: 10px 16px 10px 40px;
  border: 1.5px solid #E5E7EB; border-radius: var(--radius-sm);
  font-size: 14px; background: var(--white);
  transition: var(--transition);
}
.search-bar input:focus { outline: none; border-color: var(--primary); }
.search-bar .search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-light); font-size: 16px;
}

/* ===== 日期分组 ===== */
.date-group { margin-bottom: 20px; }

/* ===== 滚动条美化 ===== */
::-webkit-scrollbar { width: 0; height: 0; }

/* ===== 动画 ===== */
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ===== 底部安全区 ===== */
.safe-bottom { height: var(--safe-bottom); }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 抽屉导航遮罩 -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<!-- 抽屉导航 -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>✦ 创作工作台</h2>
    <p>让创作更有节奏</p>
  </div>
  <div class="drawer-nav">
    <div class="nav-item active" data-page="daily-plan">
      <div class="nav-icon">📋</div><span>每日计划</span>
    </div>
    <div class="nav-item" data-page="inspiration">
      <div class="nav-icon">💡</div><span>选题灵感</span>
    </div>
    <div class="nav-item" data-page="hot-video">
      <div class="nav-icon">🔥</div><span>爆款二创</span>
    </div>
    <div class="nav-item" data-page="review">
      <div class="nav-icon">📊</div><span>内容复盘</span>
    </div>
    <div class="nav-item" data-page="memo">
      <div class="nav-icon">📝</div><span>备忘录</span>
    </div>

  </div>
  <div class="drawer-footer">v1.0 · 数据仅存本地</div>
</div>

<!-- 顶部栏 -->
<div class="topbar" id="topbar">
  <div class="topbar-left">
    <button class="menu-btn" id="menuBtn" onclick="toggleDrawer()">☰</button>
    <div class="topbar-title" id="pageTitle">每日计划</div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="refreshBtn" onclick="refreshData()" title="刷新数据">🔄</button>
  </div>
</div>

<!-- ========== 第1页：每日计划 ========== -->
<div class="page active" id="page-daily-plan">
  <div class="page-header">
    <h1>📋 每日计划</h1>
    <p id="planDate"></p>
  </div>
  <div class="card">
    <div class="progress-text">
      <span id="planProgress">0/0 已完成</span>
      <span id="planPercent">0%</span>
    </div>
    <div class="progress-bar">
      <div class="fill" id="planFill" style="width:0%"></div>
    </div>
  </div>
  <div class="card" id="planList">
    <!-- 动态生成 -->
  </div>
  <div style="padding: 12px 0;">
    <input type="text" class="input-field" id="newPlanInput" placeholder="✏️ 添加新计划…" onkeydown="if(event.key==='Enter')addPlan()">
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="addPlan()">添加</button>
      <button class="btn btn-outline" onclick="clearDonePlans()">清除已完成</button>
    </div>
  </div>
</div>

<!-- ========== 第2页：选题灵感 ========== -->
<div class="page" id="page-inspiration">
  <div class="page-header">
    <div class="section-title">
      <h1>💡 选题灵感</h1>
      <span class="date-badge" id="inspireDate"></span>
    </div>
    <p>每天10条选题，一键跳转创作</p>
  </div>
  <div id="inspireList">
    <div class="empty-state">
      <div class="empty-icon">💡</div>
      <p>暂无灵感数据，点击刷新按钮拉取最新内容</p>
    </div>
  </div>
</div>

<!-- ========== 第3页：爆款二创 ========== -->
<div class="page" id="page-hot-video">
  <div class="page-header">
    <div class="section-title">
      <h1>🔥 爆款热点二创</h1>
      <span class="date-badge" id="hotDate"></span>
    </div>
    <p>今日热点 + 改编角度</p>
  </div>
  <div id="hotList">
    <div class="empty-state">
      <div class="empty-icon">🔥</div>
      <p>暂无热点数据，点击刷新按钮拉取最新内容</p>
    </div>
  </div>
</div>

<!-- ========== 第4页：内容复盘 ========== -->
<div class="page" id="page-review">
  <div class="page-header">
    <h1>📊 内容复盘</h1>
    <p>记录每次发布的数据和心得</p>
  </div>
  <!-- 新增复盘按钮 -->
  <button class="btn btn-primary btn-block" onclick="showReviewModal()" style="margin-bottom:16px;">+ 新增复盘记录</button>
  <div id="reviewList">
    <div class="empty-state">
      <div class="empty-icon">📊</div>
      <p>还没有复盘记录，点击上方按钮开始</p>
    </div>
  </div>
</div>

<!-- ========== 第5页：备忘录 ========== -->
<div class="page" id="page-memo">
  <div class="page-header">
    <h1>📝 备忘录</h1>
    <p>随手记，可勾选</p>
  </div>
  <div class="card" id="memoList">
    <!-- 动态生成 -->
  </div>
  <div style="margin-top: 12px;">
    <button class="btn btn-outline btn-block" onclick="addMemoRow()">+ 添加一行</button>
  </div>
</div>

<!-- 复盘模态框 -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <h3>📝 新增复盘</h3>
    <div class="form-group">
      <label>作品标题</label>
      <input type="text" class="input-field" id="reviewTitle" placeholder="输入作品标题">
    </div>
    <div class="form-group">
      <label>发布平台</label>
      <select class="input-field" id="reviewPlatform">
        <option value="抖音">抖音</option>
        <option value="B站">B站</option>
        <option value="小红书">小红书</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="stats-grid" style="margin-bottom:14px;">
      <div class="stat-box">
        <input type="number" class="stat-num" id="reviewPlays" value="0" style="width:100%;border:none;text-align:center;font-size:22px;font-weight:700;color:var(--primary);background:transparent;">
        <div class="stat-label">播放</div>
      </div>
      <div class="stat-box">
        <input type="number" class="stat-num" id="reviewLikes" value="0" style="width:100%;border:none;text-align:center;font-size:22px;font-weight:700;color:var(--primary);background:transparent;">
        <div class="stat-label">点赞</div>
      </div>
      <div class="stat-box">
        <input type="number" class="stat-num" id="reviewComments" value="0" style="width:100%;border:none;text-align:center;font-size:22px;font-weight:700;color:var(--primary);background:transparent;">
        <div class="stat-label">评论</div>
      </div>
      <div class="stat-box">
        <input type="number" class="stat-num" id="reviewShares" value="0" style="width:100%;border:none;text-align:center;font-size:22px;font-weight:700;color:var(--primary);background:transparent;">
        <div class="stat-label">转发</div>
      </div>
    </div>
    <div class="form-group">
      <label>✨ 亮点</label>
      <textarea class="auto-resize" id="reviewHighlight" rows="2" placeholder="这次做对了什么？"></textarea>
    </div>
    <div class="form-group">
      <label>⚠️ 问题</label>
      <textarea class="auto-resize" id="reviewIssue" rows="2" placeholder="这次有哪些不足？"></textarea>
    </div>
    <div class="form-group">
      <label>🚀 优化方向</label>
      <textarea class="auto-resize" id="reviewOptimize" rows="2" placeholder="下次怎么改进？"></textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-primary btn-block" onclick="saveReview()">保存复盘</button>
      <button class="btn btn-outline" onclick="closeReviewModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ===== 全局状态 =====
const STORAGE = {
  plans: 'cw_plans',
  memo: 'cw_memo',
  reviews: 'cw_reviews',
  inspiration: 'cw_inspiration',
  hotVideo: 'cw_hotvideo',
  lastFetch: 'cw_lastfetch'
};

const GIST_ID_PLACEHOLDER = '89202d2ef04022203a51d766ca6e12ba';
let currentGistId = GIST_ID_PLACEHOLDER;

const PAGE_TITLES = {
  'daily-plan': '每日计划',
  'inspiration': '选题灵感',
  'hot-video': '爆款二创',
  'review': '内容复盘',
  'memo': '备忘录'
};

// ===== 工具函数 =====
function today() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) { const dt=new Date(d); return dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'+dt.getDate()+'日'; }

function getStore(key, fallback) {
  try { const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }
  catch(e) { return fallback; }
}
function setStore(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ===== 抽屉导航 =====
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('active');
  document.getElementById('drawerOverlay').classList.toggle('active');
}
document.getElementById('drawerOverlay').addEventListener('click', toggleDrawer);

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    const page = item.dataset.page;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+page).classList.add('active');
    document.getElementById('pageTitle').textContent = PAGE_TITLES[page]||'';
    toggleDrawer();
    window.scrollTo(0,0);
  });
});

// ===== 第1页：每日计划 =====
function renderPlan() {
  const dateEl = document.getElementById('planDate');
  dateEl.textContent = formatDate(today());
  const plans = getStore(STORAGE.plans, {});
  const dayKey = today();
  const items = plans[dayKey] || [];
  const list = document.getElementById('planList');
  if (!items.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>今天还没有计划，添加一个吧</p></div>';
    document.getElementById('planProgress').textContent = '0/0 已完成';
    document.getElementById('planPercent').textContent = '0%';
    document.getElementById('planFill').style.width = '0%';
    return;
  }
  let html = '';
  items.forEach((item, i) => {
    html += `<div class="check-item ${item.done?'done':''}">
      <input type="checkbox" ${item.done?'checked':''} onchange="togglePlan(${i})">
      <label onclick="togglePlan(${i})">${escHTML(item.text)}</label>
    </div>`;
  });
  list.innerHTML = html;
  const doneCount = items.filter(x=>x.done).length;
  const pct = Math.round(doneCount/items.length*100);
  document.getElementById('planProgress').textContent = `${doneCount}/${items.length} 已完成`;
  document.getElementById('planPercent').textContent = pct+'%';
  document.getElementById('planFill').style.width = pct+'%';
}

function addPlan() {
  const input = document.getElementById('newPlanInput');
  const text = input.value.trim();
  if (!text) return;
  const plans = getStore(STORAGE.plans, {});
  const dayKey = today();
  if (!plans[dayKey]) plans[dayKey] = [];
  plans[dayKey].push({ text, done: false });
  setStore(STORAGE.plans, plans);
  input.value = '';
  renderPlan();
  toast('已添加');
}

function togglePlan(idx) {
  const plans = getStore(STORAGE.plans, {});
  const dayKey = today();
  if (plans[dayKey] && plans[dayKey][idx] !== undefined) {
    plans[dayKey][idx].done = !plans[dayKey][idx].done;
    setStore(STORAGE.plans, plans);
    renderPlan();
  }
}

function clearDonePlans() {
  const plans = getStore(STORAGE.plans, {});
  const dayKey = today();
  if (plans[dayKey]) {
    plans[dayKey] = plans[dayKey].filter(x=>!x.done);
    setStore(STORAGE.plans, plans);
    renderPlan();
    toast('已清除');
  }
}

// ===== 第2页：选题灵感 =====
function renderInspiration() {
  const data = getStore(STORAGE.inspiration, []);
  const dateEl = document.getElementById('inspireDate');
  dateEl.textContent = data.length ? formatDate(data[0].date||today()) : '未更新';
  const list = document.getElementById('inspireList');
  if (!data.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">💡</div><p>暂无灵感数据，点击刷新按钮拉取最新内容</p></div>';
    return;
  }
  let html = '';
  data.forEach((item, i) => {
    const tags = (item.tags||[]).map(t=>`<span class="tag">${escHTML(t)}</span>`).join('');
    html += `<div class="inspire-card fade-in" style="animation-delay:${i*0.05}s">
      <div class="inspire-title">${i+1}. ${escHTML(item.title)}</div>
      <div class="inspire-tags">${tags}</div>
      <div class="inspire-desc">${escHTML(item.desc)}</div>
      <div class="inspire-actions">
        ${item.douyinKeyword ? `<a class="btn btn-sm btn-primary" href="snssdk1128://search?keyword=${encodeURIComponent(item.douyinKeyword)}" onclick="toast('正在打开抖音…')">抖音搜索</a>` : ''}
        ${item.biliKeyword ? `<a class="btn btn-sm btn-outline" href="bilibili://search?keyword=${encodeURIComponent(item.biliKeyword)}" onclick="toast('正在打开B站…')">B站搜索</a>` : ''}
      </div>
    </div>`;
  });
  list.innerHTML = html;
}

// ===== 第3页：爆款二创 =====
function renderHotVideo() {
  const data = getStore(STORAGE.hotVideo, []);
  const dateEl = document.getElementById('hotDate');
  dateEl.textContent = data.length ? formatDate(data[0].date||today()) : '未更新';
  const list = document.getElementById('hotList');
  if (!data.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔥</div><p>暂无热点数据，点击刷新按钮拉取最新内容</p></div>';
    return;
  }
  let html = '';
  data.forEach((item, i) => {
    const top3 = i < 3 ? 'top3' : '';
    html += `<div class="hot-card fade-in" style="animation-delay:${i*0.05}s">
      <div style="display:flex;align-items:center;">
        <span class="hot-rank ${top3}">${i+1}</span>
        <span class="hot-content">${escHTML(item.title)}</span>
      </div>
      <div class="hot-angle">
        <strong>🎬 改编角度：</strong>${escHTML(item.angle)}
      </div>
    </div>`;
  });
  list.innerHTML = html;
}

// ===== 第4页：内容复盘 =====
function renderReviews() {
  const data = getStore(STORAGE.reviews, []);
  const list = document.getElementById('reviewList');
  if (!data.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>还没有复盘记录，点击上方按钮开始</p></div>';
    return;
  }
  let html = '';
  data.slice().reverse().forEach((item, i) => {
    const realIdx = data.length - 1 - i;
    html += `<div class="card fade-in">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:15px;">${escHTML(item.title)}</strong>
        <div style="display:flex;gap:6px;">
          <span class="tag">${escHTML(item.platform)}</span>
          <button class="del-btn" onclick="deleteReview(${realIdx})" title="删除">✕</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${item.plays||0}</div><div class="stat-label">播放</div></div>
        <div class="stat-box"><div class="stat-num">${item.likes||0}</div><div class="stat-label">点赞</div></div>
        <div class="stat-box"><div class="stat-num">${item.comments||0}</div><div class="stat-label">评论</div></div>
        <div class="stat-box"><div class="stat-num">${item.shares||0}</div><div class="stat-label">转发</div></div>
      </div>
      ${item.highlight ? `<div style="margin-top:10px;padding:8px 12px;background:#F0FFF0;border-radius:8px;font-size:13px;"><strong>✨ 亮点：</strong>${escHTML(item.highlight)}</div>` : ''}
      ${item.issue ? `<div style="margin-top:8px;padding:8px 12px;background:#FFF8F0;border-radius:8px;font-size:13px;"><strong>⚠️ 问题：</strong>${escHTML(item.issue)}</div>` : ''}
      ${item.optimize ? `<div style="margin-top:8px;padding:8px 12px;background:#F0F8FF;border-radius:8px;font-size:13px;"><strong>🚀 优化：</strong>${escHTML(item.optimize)}</div>` : ''}
      <div style="margin-top:8px;font-size:12px;color:var(--text-light);">${formatDate(item.date)}</div>
    </div>`;
  });
  list.innerHTML = html;
}

function showReviewModal() { document.getElementById('reviewModal').classList.add('active'); }
function closeReviewModal() {
  document.getElementById('reviewModal').classList.remove('active');
  ['reviewTitle','reviewHighlight','reviewIssue','reviewOptimize'].forEach(id=>{
    document.getElementById(id).value='';
  });
  ['reviewPlays','reviewLikes','reviewComments','reviewShares'].forEach(id=>{
    document.getElementById(id).value='0';
  });
}

function saveReview() {
  const title = document.getElementById('reviewTitle').value.trim();
  if (!title) { toast('请输入标题'); return; }
  const review = {
    title,
    platform: document.getElementById('reviewPlatform').value,
    plays: parseInt(document.getElementById('reviewPlays').value)||0,
    likes: parseInt(document.getElementById('reviewLikes').value)||0,
    comments: parseInt(document.getElementById('reviewComments').value)||0,
    shares: parseInt(document.getElementById('reviewShares').value)||0,
    highlight: document.getElementById('reviewHighlight').value.trim(),
    issue: document.getElementById('reviewIssue').value.trim(),
    optimize: document.getElementById('reviewOptimize').value.trim(),
    date: today()
  };
  const data = getStore(STORAGE.reviews, []);
  data.push(review);
  setStore(STORAGE.reviews, data);
  closeReviewModal();
  renderReviews();
  toast('复盘已保存');
}

function deleteReview(idx) {
  if (!confirm('确定删除这条复盘？')) return;
  const data = getStore(STORAGE.reviews, []);
  data.splice(idx, 1);
  setStore(STORAGE.reviews, data);
  renderReviews();
  toast('已删除');
}

// ===== 第5页：备忘录 =====
function renderMemo() {
  const data = getStore(STORAGE.memo, []);
  const list = document.getElementById('memoList');
  // 保证至少5行
  while (data.length < 5) data.push({ text: '', done: false });
  setStore(STORAGE.memo, data);
  let html = '';
  data.forEach((item, i) => {
    html += `<div class="memo-item ${item.done?'done':''}">
      <input type="checkbox" ${item.done?'checked':''} onchange="toggleMemo(${i})">
      <input type="text" value="${escAttr(item.text)}" placeholder="输入备忘…" onchange="updateMemo(${i},this.value)" onfocus="this.parentElement.classList.remove('done')">
      ${i >= 5 ? `<button class="del-btn" onclick="deleteMemoRow(${i})">✕</button>` : ''}
    </div>`;
  });
  list.innerHTML = html;
}

function toggleMemo(idx) {
  const data = getStore(STORAGE.memo, []);
  data[idx].done = !data[idx].done;
  setStore(STORAGE.memo, data);
  renderMemo();
}

function updateMemo(idx, val) {
  const data = getStore(STORAGE.memo, []);
  data[idx].text = val;
  setStore(STORAGE.memo, data);
}

function addMemoRow() {
  const data = getStore(STORAGE.memo, []);
  data.push({ text: '', done: false });
  setStore(STORAGE.memo, data);
  renderMemo();
  toast('已添加一行');
}

function deleteMemoRow(idx) {
  const data = getStore(STORAGE.memo, []);
  data.splice(idx, 1);
  setStore(STORAGE.memo, data);
  renderMemo();
}

// ===== 刷新数据（从 Gist） =====
async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  const topbar = document.getElementById('topbar');
  topbar.classList.add('refreshing');

  // 尝试从 Gist 拉取
  if (currentGistId && currentGistId !== 'YOUR_GIST_ID') {
    try {
      const url = `https://gist.githubusercontent.com/raw/${currentGistId}`;
      const resp = await fetch(url);
      if (resp.ok) {
        const gistData = await resp.json();
        if (gistData.inspiration) { setStore(STORAGE.inspiration, gistData.inspiration); }
        if (gistData.hotVideo) { setStore(STORAGE.hotVideo, gistData.hotVideo); }
        setStore(STORAGE.lastFetch, new Date().toISOString());
        renderAll();
        toast('✅ 数据已更新');
        topbar.classList.remove('refreshing');
        return;
      }
    } catch(e) {
      console.log('Gist fetch failed, using local data');
    }
  }

  // 无 Gist 或拉取失败：使用本地数据
  setTimeout(() => {
    renderAll();
    toast(currentGistId !== 'YOUR_GIST_ID' ? '⚠️ Gist拉取失败，使用本地数据' : '💡 配置 Gist 后可自动拉取');
    topbar.classList.remove('refreshing');
  }, 800);
}

// ===== HTML 转义 =====
function escHTML(s) {
  if (!s) return '';
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}
function escAttr(s) {
  if (!s) return '';
  return s.replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== 初始化 =====
function renderAll() {
  renderPlan();
  renderInspiration();
  renderHotVideo();
  renderReviews();
  renderMemo();
}

// 检测 Gist ID（从 URL hash 或 localStorage）
function detectGistId() {
  const hash = window.location.hash;
  if (hash && hash.startsWith('#gist=')) {
    currentGistId = hash.replace('#gist=','');
    setStore('cw_gist_id', currentGistId);
  } else {
    currentGistId = getStore('cw_gist_id', '89202d2ef04022203a51d766ca6e12ba');
  }
}

detectGistId();
renderAll();

// 自动刷新（每小时）
setInterval(refreshData, 3600000);
</script>
</body>
</html>
